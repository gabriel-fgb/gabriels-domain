<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flappy-ish</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <h1>Flappy-ish</h1>
      <p class="subtitle">Press <kbd>Space</kbd> or click/tap to flap.</p>
      <canvas id="game" width="420" height="640" aria-label="Flappy style game"></canvas>
      <div class="hud">
        <span>Score: <strong id="score">0</strong></span>
        <span>Best: <strong id="best">0</strong></span>
      </div>
      <p id="status" class="status">Press Space to start</p>
    </main>

    <script src="game.js"></script>
  </body>
</html>
